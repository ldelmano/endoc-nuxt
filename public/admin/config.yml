backend:
  name: git-gateway
  branch: main
media_folder: "public/imgs/uploads"
public_folder: "/imgs/uploads"
collections:
  - name: "categories"
    label: "Categories"
    folder: "content/categories"
    slug: "{{fields.slug}}"
    editor:
      preview: false
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Slug",
          name: "slug",
          required: false,
          widget: "string",
          hint: "Please set an unique value for this field. Do not input blank spaces. Leave it empty to get an auto-generated value.",
        }
      - { label: "Icon image", name: "icon", widget: "image" }
      - {
          label: "Show on home page",
          name: "showOnHome",
          widget: "boolean",
          default: false,
        }
  - name: "products"
    label: "Products"
    folder: "content/products"
    editor:
      preview: false
    create: true
    format: "frontmatter"
    summary: "{{fields.thumbnail}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Product ID", name: "id", widget: "string" }
      - { label: "Product image", name: "thumbnail", widget: "image" }
      - {
          label: "Category",
          name: "category",
          widget: "relation",
          collection: "categories",
          search_fields: ["title", "slug"],
          value_field: "slug",
          display_fields: ["title"],
        }
      - label: "Attributes"
        name: "attributes"
        widget: "object"
        fields:
          - { label: "Envelope Size", name: "envelopeSize", widget: "string" }
          - { label: "Adhesion Type", name: "adhesionType", widget: "string" }
          - { label: "Window Style", name: "windowStyle", widget: "string" }
          - { label: "Compatibility", name: "compatibility", widget: "string" }
          - {
              label: "Security Tint",
              name: "hasSecurityTint",
              widget: "boolean",
              default: false,
            }
          - { label: "Features", name: "features", widget: "string" }
          - { label: "Additional", name: "additional", widget: "string" }
  - name: "home-content"
    label: "Home Page - Content"
    folder: "content/home"
    create: true
    fields:
      - label: "Section 1"
        name: "section1"
        widget: "object"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "Numbered list"
            name: "list"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
