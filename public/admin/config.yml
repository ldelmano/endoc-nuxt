backend:
  name: git-gateway
  branch: main
media_folder: "public/imgs/uploads"
public_folder: "/imgs/uploads"
collections:
  - name: "categories"
    label: "Categories"
    folder: "content/categories"
    slug: "{{fields.slug}}"
    editor:
      preview: false
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Slug",
          name: "slug",
          required: false,
          widget: "string",
          hint: "Please set an unique value for this field. Do not input blank spaces. Leave it empty to get an auto-generated value.",
        }
      - { label: "Icon image", name: "icon", widget: "image" }
      - {
          label: "Show on home page",
          name: "showOnHome",
          widget: "boolean",
          default: false,
        }
  - name: "products"
    label: "Products"
    folder: "content/products"
    editor:
      preview: false
    create: true
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Product ID", name: "id", widget: "string" }
      - { label: "Product image", name: "thumbnail", widget: "image" }
      - {
          label: "Category",
          name: "category",
          widget: "relation",
          collection: "categories",
          search_fields: ["title", "slug"],
          value_field: "slug",
          display_fields: ["title"],
        }
      - label: "Attributes"
        name: "attributes"
        widget: "object"
        fields:
          - { label: "Envelope Size", name: "envelopeSize", widget: "string" }
          - { label: "Adhesion Type", name: "adhesionType", widget: "string" }
          - { label: "Window Style", name: "windowStyle", widget: "string" }
          - { label: "Compatibility", name: "compatibility", widget: "string" }
          - {
              label: "Security Tint",
              name: "hasSecurityTint",
              widget: "boolean",
              default: false,
            }
          - { label: "Features", name: "features", widget: "string" }
          - { label: "Additional", name: "additional", widget: "string" }
  - name: "reviews"
    label: "Reviews"
    folder: "content/reviews"
    create: true
    slug: "{{fields.id}}"
    fields:
      - { label: "Review ID", name: "id", widget: "id" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Author", name: "authorName", widget: "string" }
      - { label: "Author - Subtitle", name: "authorSub", widget: "string" }
  - label: "Home page - Content"
    name: "home-content"
    files:
      - name: "home-section-1"
        label: "Home Page - Section 1"
        file: "content/home/section1.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "Numbered list"
            name: "list"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
      - name: "become-seller"
        label: "Home Page - Become a Seller"
        file: "content/home/become-seller.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - { label: "Cover Image", name: "coverImage", widget: "image" }
  - name: "about-us"
    label: "About us"
    files:
      - name: "about-top-banner"
        label: "Content"
        file: "content/about-us/topbanner.md"
        fields:
          - label: "Top banner"
            name: "topBanner"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Body", name: "body", widget: "markdown" }
      - name: "about-section-1"
        label: "Content Section 1"
        file: "content/about-us/section1.md"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "about-section-2"
        label: "Content Section 2"
        file: "content/about-us/section2.md"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - label: "Differentials"
            name: "differentials"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
